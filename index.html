<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NutriBook</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>NutriBook</h1>
      <p class="tagline">Store recipes, see what they're made of.</p>
    </header>

    <main class="app-main">
      <section class="panel" aria-labelledby="search-heading">
        <h2 id="search-heading">Find a recipe</h2>
        <form id="search-form" role="search">
          <label for="search-input">Search recipes</label>
          <input id="search-input" name="query" type="search" autocomplete="off" />
        </form>
        <p id="recipe-list-empty" class="empty">No recipes yet. Add one on the right.</p>
        <ul id="recipe-list" class="recipe-list"></ul>
        <div class="list-actions">
          <button type="button" id="export-all">Export all</button>
          <button type="button" id="import-recipes">Import…</button>
          <input id="import-file" type="file" accept="application/json,.json" hidden />
        </div>
        <p id="import-status" class="share-status" role="status"></p>
      </section>

      <section class="panel" aria-labelledby="editor-heading">
        <h2 id="editor-heading">Recipe</h2>
        <form id="recipe-form" novalidate>
          <label for="recipe-name">Name</label>
          <input id="recipe-name" name="name" type="text" />

          <label for="recipe-servings">Servings</label>
          <input id="recipe-servings" name="servings" type="number" min="1" step="1" value="4" />

          <fieldset>
            <legend>Ingredients</legend>
            <ul id="ingredient-list" class="ingredient-list"></ul>
            <button type="button" id="add-ingredient">Add ingredient</button>
          </fieldset>

          <ul id="recipe-problems" class="problems" role="alert"></ul>

          <div class="form-actions">
            <button type="submit">Save recipe</button>
            <button type="button" id="new-recipe">New recipe</button>
            <button type="button" id="export-recipe" hidden>Export</button>
            <button type="button" id="copy-recipe" hidden>Copy as text</button>
          </div>
          <p id="share-status" class="share-status" role="status"></p>
        </form>
      </section>

      <section class="panel" aria-labelledby="nutrition-heading">
        <h2 id="nutrition-heading">Nutrition</h2>
        <dl id="nutrition-totals" class="nutrition-totals"></dl>
        <ul id="rating-list" class="rating-list"></ul>
      </section>
    </main>

    <script type="module" src="src/ui.js"></script>
  </body>
</html>
